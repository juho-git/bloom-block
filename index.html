<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fff4f0" />
    <title>블룸 블록</title>
    <!-- Noto Sans KR: Google Fonts CDN (OFL) — subsetted by the API -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Jua — SIL Open Font License 1.1, self-hosted */
      @font-face {
        font-family: 'Jua';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/Jua-Regular.ttf') format('truetype');
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff4f0;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #fff4f0;
        color: #5a4450;
        font-family: 'Jua', 'Noto Sans KR', sans-serif;
        font-size: 20px;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      @media (orientation: landscape) and (max-height: 500px) {
        #rotate-hint {
          display: flex;
        }
        #game-container {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate-hint">세로 모드로 돌려 주세요 🌸</div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
