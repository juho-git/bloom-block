<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>블룸 블록</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff8e1;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #fff8e1;
        color: #5d4037;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 18px;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      @media (orientation: landscape) and (max-height: 500px) {
        #rotate-hint {
          display: flex;
        }
        #game-container {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate-hint">세로 모드로 돌려 주세요 📱</div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
